name: Site bug
description: Something is broken in the web app (search, notes, progress, layout, sign-in)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Browser and device
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
