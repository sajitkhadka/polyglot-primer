name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GitHub-hosted: this job needs nothing from a private network.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/scratch
      - run: npm run build
        env:
          SITE_URL: https://example.org
      - name: Build the container image
        run: docker build -t polyglot-primer:ci .
