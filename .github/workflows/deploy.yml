name: Deploy (optional, self-hosted GitOps)

# Tag-driven release. Pushing vX.Y.Z builds the image, commits the new tag into the config repo, and
# Argo CD (automated sync) rolls it out; a GitHub Release with generated notes is created at the end.
# The build/deploy jobs are optional for the maintainer's own cluster: they are skipped unless the
# repository variable REGISTRY is set, so forks and clones just get the Release. Everything
# environment-specific comes from repository variables and secrets, not from this file:
#
#   vars:    REGISTRY (e.g. registry.example:5000), K8S_CONFIG_REPO (owner/name), MANIFEST (path inside
#            that repo), SITE_URL, REPO_URL (optional)
#   secrets: REGISTRY_USER, REGISTRY_PASSWORD, K8S_CONFIG_DEPLOY_KEY (a write deploy key for K8S_CONFIG_REPO)
#
# It never talks to the cluster: a GitOps controller (Argo CD) owns what is running.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual run'
        required: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE: polyglot-primer
  MANIFEST: ${{ vars.MANIFEST }}

# Two runs close together would otherwise race on the push to the config repo.
concurrency:
  group: deploy-manifests
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ vars.REGISTRY != '' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker build \
            --build-arg SITE_URL="${{ vars.SITE_URL }}" \
            --build-arg REPO_URL="${{ vars.REPO_URL }}" \
            -t "$REGISTRY/$IMAGE:${{ github.sha }}" \
            -t "$REGISTRY/$IMAGE:latest" \
            .
          docker push "$REGISTRY/$IMAGE:${{ github.sha }}"
          docker push "$REGISTRY/$IMAGE:latest"

  update-manifests:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      # Write access to the config repo comes from a deploy key scoped to that one repo, not a PAT.
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.K8S_CONFIG_REPO }}
          ssh-key: ${{ secrets.K8S_CONFIG_DEPLOY_KEY }}
          path: k8s-config
          ref: main

      - name: Point the manifest at the new image
        working-directory: k8s-config
        run: |
          set -euo pipefail
          sed -i -E "s|(image: .*/${IMAGE}:).*|\1${{ github.sha }}|" "$MANIFEST"
          # Fail loudly rather than committing a manifest the sed missed.
          grep -q "${IMAGE}:${{ github.sha }}" "$MANIFEST" \
            || { echo "failed to set image in $MANIFEST"; exit 1; }
          git diff --stat

      - name: Commit and push
        working-directory: k8s-config
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "manifest already points at ${{ github.sha }} - nothing to commit"
            exit 0
          fi
          git config user.name  "polyglot-primer-ci"
          git config user.email "polyglot-primer-ci@users.noreply.github.com"
          git commit -am "deploy(polyglot-primer): ${{ github.ref_name }}

          Image built from ${{ github.repository }}@${{ github.sha }} by ${{ github.workflow }}
          run ${{ github.run_id }}."
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "could not push manifest update after 3 attempts"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Committed"
            echo ""
            echo "Image tag \`${{ github.sha }}\` committed to \`${{ vars.K8S_CONFIG_REPO }}\`."
            echo "The GitOps controller auto-syncs it; it should be live within a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"

  # Only after the manifests are committed, so a Release exists only for a tag that actually shipped.
  release:
    needs: update-manifests
    # Runs when the optional deploy above succeeded or was skipped (forks), never when it failed, and only for a real tag.
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Safe to re-run: a re-run of this workflow must not fail on an existing release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"; exit 0
          fi
          flags=(--generate-notes --verify-tag --title "$GITHUB_REF_NAME")
          # v1.2.3-rc1 (any pre-release suffix) is a pre-release.
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
