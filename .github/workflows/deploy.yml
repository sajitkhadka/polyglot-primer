name: Deploy

# Builds the image and records the new tag in the k8s-config repo. It does not talk to the
# cluster: Argo CD owns what is running, and this workflow's job is to change the desired
# state in git (same shape as sync-todo and ect-relay).
#
# Pushing a tag stages a release; it does not ship it. Argo CD is on manual sync, so the app
# shows OutOfSync until someone syncs `polyglot-primer` at https://argo.int.sajitkhadka.com.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual run'
        required: false

env:
  REGISTRY: 192.168.0.120:5000
  IMAGE: polyglot-primer
  MANIFEST: polyglot-primer/polyglot-primer-deployment.yaml

# Two runs close together would otherwise race on the push to k8s-config.
concurrency:
  group: deploy-manifests
  cancel-in-progress: false

jobs:
  build-and-push:
    # Self-hosted: the registry is plain HTTP on a private LAN address.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker build \
            -t "$REGISTRY/$IMAGE:${{ github.sha }}" \
            -t "$REGISTRY/$IMAGE:latest" \
            .
          docker push "$REGISTRY/$IMAGE:${{ github.sha }}"
          docker push "$REGISTRY/$IMAGE:latest"

  update-manifests:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      # Write access to k8s-config comes from a deploy key scoped to that one repo, not a PAT.
      - uses: actions/checkout@v7
        with:
          repository: sajitkhadka/k8s-config
          ssh-key: ${{ secrets.K8S_CONFIG_DEPLOY_KEY }}
          path: k8s-config
          ref: main

      - name: Point the manifest at the new image
        working-directory: k8s-config
        run: |
          set -euo pipefail
          sed -i -E "s|(image: .*/${IMAGE}:).*|\1${{ github.sha }}|" "$MANIFEST"
          # Fail loudly rather than committing a manifest the sed missed.
          grep -q "${IMAGE}:${{ github.sha }}" "$MANIFEST" \
            || { echo "failed to set image in $MANIFEST"; exit 1; }
          git diff --stat

      - name: Commit and push
        working-directory: k8s-config
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "manifest already points at ${{ github.sha }} - nothing to commit"
            exit 0
          fi
          git config user.name  "polyglot-primer-ci"
          git config user.email "polyglot-primer-ci@users.noreply.github.com"
          git commit -am "deploy(polyglot-primer): ${{ github.ref_name }}

          Image built from polyglot-primer@${{ github.sha }} by ${{ github.workflow }}
          run ${{ github.run_id }}."
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          echo "could not push manifest update after 3 attempts"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Staged"
            echo ""
            echo "Image tag \`${{ github.sha }}\` committed to k8s-config."
            echo "Argo CD is on manual sync, so this is **not live yet**: sync \`polyglot-primer\` at"
            echo "<https://argo.int.sajitkhadka.com>. Site: <https://primer.int.sajitkhadka.com> (LAN/WireGuard only)."
          } >> "$GITHUB_STEP_SUMMARY"
